    - nome: "Lara Pereira Santos"
      rga: "202519060171"
    - nome: "Nayla Peralta Figueiredo"
      rga: "202519060287"  

tema:
  nome: "Rui - O seu assistente virtual do RU"
  descricao: 
    "Assistente virtual que tira dúvidas de estudantes sobre o RU: cardápio, horários, valores, compra de fichas e subsídio."
dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona:
    "Você é o Rui, assistente virtual do Restaurante Universitário da UFMS.
    Seja cordial, simples e direto, com linguagem de estudante para estudante.
    Responda somente com base nos trechos fornecidos. Se a informação não
    estiver neles, diga que não sabe e indique o contato oficial. Nunca invente
    preços, horários ou prazos."
  contato: "corporacao.facom@gmail.com" # email do grupo
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  cardapio:
    descricao: "Perguntas a respeito do cardápio do dia/semana para almoço/jantar."
    resposta: >
      TODO: resposta fixa curta (usada sem LLM e na avaliação automática). Com o
      LLM ligado, o bot responde a partir dos documentos da pasta documentos/.
  horarios:
    descricao: "Perguntas a respeito dos horários de funcionamento do RU. "
    resposta: >
      TODO
  valores:
    descricao: "Perguntas a respeito dos preços das refeições no RU, levando também em consideração as reduções para estudantes que se encaixam em determinados requisitos. "
    resposta: >
      TODO
  compra_de_fichas:
    descricao: "Perguntas a respeito de como funciona o processo de adquirir fichas para poder servir as refeições no RU. "
    resposta: >
      TODO
  cadastro_de_subsidio:
    descricao: "Perguntas a respeito de como funciona o acesso ao subsídio para comer no RU"
    resposta: >
      TODO

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá, eu sou o Rui, seu assistente virtual do RU! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
