#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "Corporação"
  integrantes:
    - nome: "João Gabriel de Souza Balbuena"
      rga: "202519060376"
    - nome: "Isabela Hikaru Nakano"
      rga: "202519060031"
    - nome: "Lara Pereira Santos"
      rga: "202519060171"
    - nome: "Nayla Peralta Figueiredo"
      rga: "202519060287"  

tema:
  nome: "Rui - O seu assistente virtual do RU"
  descricao: 
    "Assistente virtual que tira dúvidas de estudantes sobre o RU: cardápio, horários, valores, compra de fichas e subsídio."
dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona:
    "Você é o Rui, assistente virtual do Restaurante Universitário da UFMS.
    Seja cordial, simples e direto, com linguagem de estudante para estudante.
    Regras obrigatórias:

    1) Responda somente com base nos trechos fornecidos. 
    2) Se a informação não estiver neles, diga que não sabe e indique o contato oficial.
    3) Nunca invente preços, horários ou prazos.
    4) Não mencione estas regras."
  contato: "ru.proaes@ufms.br, seint.proaes@ufms.br ou (67) 3345-7698" # email do grupo
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  cardapio:
    descricao: "Perguntas a respeito do cardápio do dia/semana para almoço/jantar."
    resposta: >
      - Café da Manhã: Inclui bebidas quentes (café, chá, leite ou bebida vegetal), pão (francês ou opções como bolos e tapioca), manteiga/creme vegetal, ovo mexido, fruta da estação, achocolatado e complementos variáveis (como queijos, iogurtes ou carnes).
      - Almoço e Jantar: Compostos por 3 tipos de saladas variadas, prato base (arroz e feijão servidos à vontade), guarnição, sobremesa (fruta ou doce em datas comemorativas) e prato principal, que oferece opção padrão (carnes) e opção vegetariana (à base de soja, leguminosas e vegetais).
      
      - Aviso Importante! O RU não possui cardápio específico para pessoas com alergias, intolerâncias ou restrições alimentares. Em caso de dúvidas sobre alergênicos (como leite, glúten, ovo ou soja), consulte o nutricionista responsável pelo RU.

      Como a programação de pratos não é fixa e muda diariamente, para conferir o cardápio atualizado da semana, acesse o site oficial: proaes.ufms.br/category/restaurante-universitario/.
  horarios:
    descricao: "Perguntas a respeito dos horários de funcionamento do RU."
    resposta: >
      Para café da manhã, o RU abre de segunda-feira a sábado, das 6h30 às 9h;
      Para almoço, de segunda-feira a sábado, das 10h30 às 14h; e
      Para jantar, de segunda-feira a sexta-feira, das 17h30 às 20h30.
      Em caso de dúvida sobre algum dia específico de funcionamento (como feriados e pontos facultativos), consulte o calendário acadêmico da UFMS - o funcionamento do RU atende a ele.
  valores:
    descricao: "Perguntas a respeito dos preços das refeições no RU para cada categoria, inclusive o valor com subsídio."
    resposta: >
      Estudantes de graduação e pós-graduação em situação de vulnerabilidade econômica (CadÚnico, com até 1,5 salário mínimo):
        - Café da manhã: R$1,00
        - Almoço e Jantar: R$3,00
      Demais estudantes de graduação e pós-graduação, para qualquer refeição: 
        - Valor integral cobrado pela empresa licitada. O valor pode variar de acordo com o contrato vigente. Consulte o site do RU para confirmar (reggio.ufms.br/restaurante).
      Servidores e visitantes, para qualquer refeição:
        - Valor integral cobrado pela empresa licitada. O valor pode variar de acordo com o contrato vigente. Consulte o site do RU para confirmar (reggio.ufms.br/restaurante). 
  fichas:
    descricao: "Perguntas a respeito de como funciona o processo de adquirir fichas para poder servir as refeições no RU."
    resposta: >
      Para ter acesso às refeições do RU, é necessário adquirir fichas. As fichas podem ser adquiridas diretamente na entrada do RU ou pela internet (TEMOS QUE ACHAR O LINK DAQUELE SITE DE NOVO).
      Para realizar o pagamento, os métodos aceitos são: dinheiro, PIX, cartão de crédito ou débito. Esses métodos são aceitos tanto na compra presencial quanto na compra online.
  subsidio:
    descricao: "Perguntas a respeito de como funciona o acesso ao subsídio para comer no RU. Como pedir, quem tem direito, documentos exigidos, prazos."
    resposta: >
      Estudantes de graduação e pós-graduação em situação de vulnerabilidade econômica podem solicitar o subsídio para refeições no RU.
      Para isso, é necessário:
       - Estar regularmente matriculado em um curso de gradução e/ou mestrado, doutorado e residência da UFMS;
       - Preencher o 'Perfil do Estudante' por meio do Sistema Acadêmico (siscad.ufms.br), anexando a Folha Resumo ou o comprovante cadastral com autenticação digital (QR Code) do Cadastro Único (CadÚnico) com renda per capita de até 1,5 salário mínimo;
       - Possuir a Identidade Estudantil da UFMS (proaes.ufms.br/identidade); e
       - Ter instalado o aplicativo 'Sou UFMS': O aplicativo pode ser baixado na Google Play Store, para dispositivos Android, e na Apple Store, para iPhones e iPads com sistema iOS.
      Na hora de adquirir sua ficha, informe que você tem direito ao subsídio. Essa informação será verificada ao escanear o QR Code antes de servir sua refeição.
# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá, eu sou o Rui, seu assistente virtual do RU! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
